# PlatePal nginx site config — deploy to /etc/nginx/sites-available/platepal
# and symlink into /etc/nginx/sites-enabled/. Reload with: sudo nginx -t && sudo systemctl reload nginx
#
# The recipe wiki backend runs in Docker, bound to 127.0.0.1:8091, and is
# reached from the SPA at /wiki-api (rewritten to the backend's /api).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plate-pal.de www.plate-pal.de;

    ssl_certificate /etc/letsencrypt/live/plate-pal.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plate-pal.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;

    # Vue website (SPA)
    location / {
        root /var/www/platepal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # PlatePal API (existing)
    location /api/ {
        proxy_pass http://localhost:7167/;
        include proxy_params;
    }

    # Solix watch API (existing)
    location /solix/ {
        proxy_pass http://localhost:8723/;
        include proxy_params;
    }

    # Recipe Wiki API (Docker, loopback-only) — /wiki-api/* -> backend /api/*
    location /wiki-api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # room for base64 image uploads (max 5 MB decoded)
    }
}

# Redirect http -> https
server {
    listen 80;
    listen [::]:80;
    server_name plate-pal.de www.plate-pal.de;
    return 301 https://$host$request_uri;
}
